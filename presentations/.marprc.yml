# Marp Configuration
# Diese Datei wird automatisch von Marp CLI gelesen

# Standard-Theme
theme: linux-theme

# Theme-Verzeichnis
themeSet:
  - ../themes

# Optionen für alle Builds
options:
  html: true
  allowLocalFiles: true

# PDF-Optionen
pdf:
  outlines: true
  pdfOutlines: true

# HTML-Optionen
html:
  minify: false
